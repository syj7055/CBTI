<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBTI: Chess Behavioral Type Indicator</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <script type="module" src="https://unpkg.com/chessboard-element?module"></script>
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-light: #0b0f19;
            --point-mint: #00FFAA;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(11, 15, 25, 0.65);
            --glass-border: rgba(0, 255, 170, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }

        body {
            background: radial-gradient(circle at 50% 50%, #08241d 0%, var(--bg-light) 60%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------------------------------------------------
           [1] 패널 기본 및 초기 화면 (Page 1) 
           --------------------------------------------------- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 56px 48px;
            width: 90%;
            max-width: 480px;  
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 170, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10; 
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        .page.active-flex { display: flex; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #page1 .main-title {
            font-size: 46px; font-weight: 800; margin-bottom: 8px; text-align: center; letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #page1 .sub-title { font-size: 17px; font-weight: 500; text-align: center; color: var(--text-muted); margin-bottom: 40px; }
        
        #page1 .input-group { position: relative; margin-bottom: 32px; }
        #page1 .input-label { display: block; font-size: 16px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
        #page1 .input-label span { color: var(--point-mint); }

        #page1 input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-main); font-size: 18px; padding: 18px; outline: none; transition: all 0.3s;
        }
        #page1 input[type="text"]:focus { border-color: var(--point-mint); box-shadow: 0 0 15px rgba(0, 255, 170, 0.15); }

        #page1 button.primary-btn {
            width: 100%; background: var(--point-mint); color: #05070a; border: none; padding: 20px;
            font-size: 18px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }
        #page1 button.primary-btn:hover { transform: translateY(-2px); background: #1affb8; box-shadow: 0 8px 25px rgba(0, 255, 170, 0.4); }
        #page1 button.primary-btn:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }


        /* ---------------------------------------------------
           [2] 결과 화면 (Page 2)
           --------------------------------------------------- */
        .glass-panel.large { 
            max-width: 840px; 
            height: auto;
            max-height: 85vh; 
            padding: 32px 36px;  
        }

        #loading-header { text-align: center; }
        #loading-header .main-title { 
            font-size: 22px; font-weight: 800; letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; 
        }
        #loading-header .sub-title { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 0; }

        .result-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 8px; padding: 0 8px 16px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .result-user { font-size: 20px; font-weight: 600; color: #ffffff; letter-spacing: 0.5px; }
        .result-type {
            font-size: 28px; font-weight: 900; letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1;
        }

        .content-body { display: flex; gap: 24px; flex: 1; overflow: hidden; margin-top: 12px; }
        .left-col { flex: 1.1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 8px; }
        .right-col { flex: 0.9; display: flex; flex-direction: column; gap: 12px; }

        .trait-row { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 14px 20px; }
        .trait-title { text-align: center; font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .trait-title span.vs { color: #8b95a5; font-size: 12px; font-weight: 400; margin: 0 6px; }
        .trait-desc { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        .trait-labels { display: flex; justify-content: space-between; margin-bottom: 6px; align-items: flex-end; }
        .trait-labels span { font-size: 15px; font-weight: 800; line-height: 1.1; }
        .trait-labels small { font-size: 11px; font-weight: 500; display: block; margin-top: 2px; text-transform: uppercase; }

        .bar-container { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, 0.05); }
        .bar-segment { transition: width 1s cubic-bezier(0.25, 0.8, 0.25, 1); }

        .action-card {
            flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border);
            border-radius: 12px; display: flex; flex-direction: row; align-items: center;
            text-align: left; padding: 16px 20px; gap: 16px; cursor: pointer;
            transition: all 0.3s ease; color: var(--text-main);
        }
        .action-card:hover {
            background: rgba(0, 255, 170, 0.08); border-color: var(--point-mint);
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 255, 170, 0.15);
        }
        .action-icon { font-size: 28px; flex-shrink: 0; }
        .action-text { display: flex; flex-direction: column; }
        .action-text h3 { font-size: 15px; font-weight: 700; color: var(--point-mint); margin-bottom: 4px; }
        .action-text p { font-size: 12px; color: var(--text-muted); line-height: 1.4; word-break: keep-all;}

        .button-group { display: flex; gap: 10px; margin-top: auto; }
        .secondary-btn { 
            flex: 1; background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted); 
            padding: 14px 10px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
        }
        .secondary-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        .help-btn { border-color: rgba(0, 255, 170, 0.4); color: var(--point-mint); }
        .help-btn:hover { background: rgba(0, 255, 170, 0.1); border-color: var(--point-mint); }

        .loading-view { text-align: center; padding: 24px 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .loading-view p { color: var(--point-mint); font-size: 16px; margin-bottom: 6px; font-weight: 600;}
        .loading-view span { color: var(--text-muted); font-size: 13px; }

        /* ---------------------------------------------------
           [3] 퍼즐 추천 화면 전용 스타일 (Page 3)
           --------------------------------------------------- */
        .puzzle-card {
            background: rgba(20, 25, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--point-mint);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .puzzle-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(0,255,170,0.05) 0%, transparent 100%);
            z-index: 0; pointer-events: none;
        }
        .puzzle-card:hover { 
            transform: translateX(4px); 
            border-color: rgba(0, 255, 170, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        /* 체스판 영역 */
        .puzzle-board-wrapper {
            width: 90px;
            height: 90px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1;
        }
        chess-board { width: 100%; height: 100%; }

        .puzzle-info { position: relative; z-index: 1; flex: 1; }
        .puzzle-info h4 { font-size: 15px; color: #fff; margin-bottom: 6px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;}
        .puzzle-info h4 span.tag { 
            font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 255, 170, 0.15); color: var(--point-mint); font-weight: 600;
        }
        .puzzle-info p { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 4px; }
        .puzzle-info p strong { color: #d1d5db; font-weight: 600; }
        
        .puzzle-btn {
            position: relative; z-index: 1;
            background: transparent; color: var(--point-mint); 
            border: 1px solid var(--point-mint); padding: 10px 18px; 
            border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
            text-decoration: none; transition: all 0.3s;
            white-space: nowrap; flex-shrink: 0;
        }
        .puzzle-btn:hover { background: var(--point-mint); color: #000; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2.5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 170, 0.5); }

        @media (max-width: 768px) {
            .content-body { flex-direction: column; overflow-y: auto; gap: 16px;}
            .left-col { overflow-y: visible; padding-right: 0; }
            .right-col { flex: none; }
            .action-card { min-height: 100px; }
            .glass-panel.large { max-height: 90vh; padding: 24px; }
            .puzzle-card { flex-direction: column; text-align: center; gap: 12px; }
            .puzzle-btn { width: 100%; margin-left: 0; text-align: center; }
            .puzzle-board-wrapper { width: 120px; height: 120px; margin: 0 auto; }
            .puzzle-info h4 { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="glass-panel" id="main-panel">
        
        <div id="page1" class="page active">
            <h1 class="main-title">CBTI</h1>
            <h2 class="sub-title">Chess Behavioral Type Indicator</h2>
            
            <div class="input-group">
                <label class="input-label">Type your <span>Chess ID</span></label>
                <input type="text" id="username" placeholder="e.g. hikaru" autocomplete="off">
            </div>
            
            <button class="primary-btn" id="fetch-btn" onclick="analyzeMockGames()">기보 분석하기</button>
        </div>

        <div id="page2" class="page">
            <div id="loading-header">
                <h1 class="main-title" id="loading-user"></h1>
                <p class="sub-title" id="result-status">데이터 수집 중...</p>
            </div>

            <div class="result-header" id="result-header" style="display: none;">
                <div class="result-user" id="display-user"></div>
                <div class="result-type" id="display-type"></div>
            </div>
            
            <div id="loading-view" class="loading-view">
                <p>♟️ Chess.com 아카이브 탐색 중...</p>
                <span>최근 기보를 기반으로 플레이 스타일을 스캔합니다.</span>
            </div>

            <div id="result-content" class="content-body" style="display: none;">
                <div class="left-col" id="result-container"></div>
                <div class="right-col">
                    <div class="action-card" onclick="alert('오프닝 추천 페이지 준비중입니다!')">
                        <div class="action-icon">📖</div>
                        <div class="action-text">
                            <h3>맞춤형 오프닝 추천</h3>
                            <p>당신의 CBTI 성향에 가장 어울리는 최적의 오프닝을 확인하세요.</p>
                        </div>
                    </div>
                    
                    <div class="action-card" onclick="openPuzzlePage()">
                        <div class="action-icon">🧩</div>
                        <div class="action-text">
                            <h3>최적의 퍼즐 큐레이션</h3>
                            <p>취약점을 보완하고 강점을 극대화할 맞춤형 전술 훈련을 시작하세요.</p>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="secondary-btn" onclick="goBack()">다른 ID 검색</button>
                        <button class="secondary-btn help-btn" onclick="showHelp()">💡 계산 방식 안내</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="page3" class="page">
            <div class="result-header" style="padding-bottom: 12px;">
                <div class="result-user" id="puzzle-user"></div>
                <div class="result-type" style="font-size: 20px;">🧩 맞춤형 퍼즐 큐레이션</div>
            </div>
            
            <p class="sub-title" style="text-align: left; margin-bottom: 20px; color: #00FFAA; font-size: 13px;" id="puzzle-status">
                당신의 최근 실전 기보에서 추출한 가장 유사한 상황의 퍼즐입니다.
            </p>

            <div id="puzzle-list" style="display: flex; flex-direction: column; overflow-y: auto; max-height: 55vh; padding-right: 8px;">
            </div>

            <div class="button-group" style="margin-top: 24px;">
                <button class="secondary-btn" onclick="backToResult()">⬅ 결과 화면으로 돌아가기</button>
            </div>
        </div>

    </div>

    <script>
        // 문자열을 해시(정수)로 변환 (고정 시드 생성용)
        function getStringHash(str) {
            let hash = 0;
            str = str.toLowerCase();
            for (let i = 0; i < str.length; i++) {
                hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
            }
            return hash;
        }

        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        async function analyzeMockGames() {
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return alert("Chess ID를 입력해주세요.");

            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "분석 중...";

            document.getElementById('page1').classList.remove('active');
            const page2 = document.getElementById('page2');
            page2.classList.add('active-flex');
            document.getElementById('main-panel').classList.add('large');
            
            document.getElementById('loading-user').innerText = usernameInput;
            
            const loadingHeader = document.getElementById('loading-header');
            const resultHeader = document.getElementById('result-header');
            const loadingView = document.getElementById('loading-view');
            const resultContent = document.getElementById('result-content');
            const container = document.getElementById('result-container');

            document.getElementById('result-status').innerText = "최근 플레이 스타일을 분석하고 있습니다...";
            
            loadingHeader.style.display = 'block';
            resultHeader.style.display = 'none';
            loadingView.style.display = 'flex';
            resultContent.style.display = 'none';
            container.innerHTML = '';

            await new Promise(r => setTimeout(r, 1200));

            try {
                const seed = getStringHash(usernameInput);
                const rng = mulberry32(seed);

                const getGaussianScore = () => {
                    const val = (rng() + rng()) / 2;
                    return Math.floor(val * 101);
                };

                const axesData = [
                    { leftTitle: "기억형(M)", rightTitle: "직관형(I)", desc: "오프닝 이론 숙지도 깊이", color: "#00FFAA", letters: ['M', 'I'] },
                    { leftTitle: "전술형(T)", rightTitle: "전략형(P)", desc: "위상적 복잡도 선호도 (TDA)", color: "#F4A261", letters: ['T', 'P'] },
                    { leftTitle: "미들(M)", rightTitle: "엔드(E)", desc: "페이즈별 강점 (M-Score)", color: "#2A9D8F", letters: ['M', 'E'] },
                    { leftTitle: "공격형(A)", rightTitle: "균형형(B)", desc: "희생 빈도 및 불균형 비율", color: "#CDB4DB", letters: ['A', 'B'] }
                ];

                let html = '';
                let cbtiTypeString = ''; 

                axesData.forEach(axis => {
                    const scoreLeft = getGaussianScore();
                    const scoreRight = 100 - scoreLeft;
                    const isLeftDominant = scoreLeft >= scoreRight;

                    cbtiTypeString += isLeftDominant ? axis.letters[0] : axis.letters[1];

                    const leftBgColor = isLeftDominant ? axis.color : 'rgba(255,255,255,0.05)';
                    const rightBgColor = !isLeftDominant ? axis.color : 'rgba(255,255,255,0.05)';
                    const leftTextColor = isLeftDominant ? axis.color : '#8b95a5';
                    const rightTextColor = !isLeftDominant ? axis.color : '#8b95a5';

                    html += `
                        <div class="trait-row">
                            <div class="trait-title">${axis.leftTitle} <span class="vs">vs</span> ${axis.rightTitle}</div>
                            <div class="trait-desc">${axis.desc}</div>
                            
                            <div class="trait-labels">
                                <span style="color: ${leftTextColor}; text-align: left;">
                                    ${scoreLeft}%<br><small>${axis.leftTitle.replace(/\(.*\)/,'')}</small>
                                </span>
                                <span style="color: ${rightTextColor}; text-align: right;">
                                    ${scoreRight}%<br><small>${axis.rightTitle.replace(/\(.*\)/,'')}</small>
                                </span>
                            </div>
                            
                            <div class="bar-container">
                                <div class="bar-segment" style="width: ${scoreLeft}%; background: ${leftBgColor};"></div>
                                <div class="bar-segment" style="width: ${scoreRight}%; background: ${rightBgColor};"></div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                
                loadingHeader.style.display = 'none';
                resultHeader.style.display = 'flex';
                document.getElementById('display-user').innerText = usernameInput;
                document.getElementById('display-type').innerText = cbtiTypeString;

                loadingView.style.display = 'none';
                resultContent.style.display = 'flex';

            } catch (error) {
                document.getElementById('result-status').innerText = "분석 중 오류가 발생했습니다.";
                loadingView.innerHTML = `<div style="color: #ff4a4a; font-weight:600;">데이터를 불러오지 못했습니다.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "기보 분석하기";
            }
        }

        // ==========================================
        // 🧩 퍼즐 추천 페이지 로직
        // ==========================================
        function openPuzzlePage() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('page3').classList.add('active-flex');
            document.getElementById('puzzle-user').innerText = document.getElementById('username').value.trim().toUpperCase();
            
            renderDummyPuzzles();
        }

        function backToResult() {
            document.getElementById('page3').classList.remove('active-flex');
            document.getElementById('page2').classList.add('active-flex');
        }

        function renderDummyPuzzles() {
            const list = document.getElementById('puzzle-list');
            list.innerHTML = '';
            
            const currentUsername = document.getElementById('username').value.trim();
            const rng = mulberry32(getStringHash(currentUsername + "puzzle2026"));

            // 파이썬/데이터에서 추출한 실제 퍼즐 샘플 (FEN 포함)
            const rawPuzzles = [
                { id: "00B8m", fen: "3b4/3P4/pp2Pk2/5r2/P6p/3Q4/8/7K w - - 1 43", rating: 1277, themes: ["crushing", "endgame", "hangingPiece"] },
                { id: "00BCa", fen: "1r6/p2kp1P1/3p4/2pP4/2P2B2/pN6/5PK1/8 b - - 1 41", rating: 1426, themes: ["advancedPawn", "crushing", "endgame", "promotion"] },
                { id: "00BJm", fen: "r2q1rk1/1Q2bppp/p1N1p3/1p6/2pP1n2/2P5/PP3PPP/R4RK1 b - - 1 18", rating: 1107, themes: ["advantage", "fork", "hangingPiece", "middlegame"] },
                { id: "00BKa", fen: "5rk1/p1Rb1ppp/2n1pn2/8/8/2P3P1/q4PBP/1rNQK2R b K - 2 16", rating: 2450, themes: ["advantage", "long", "middlegame"] },
                { id: "00BM8", fen: "r4rk1/pp2bppp/2ppnn2/8/N1P1P3/q1P4P/P2N2PB/R2Q1R1K b - - 0 16", rating: 1526, themes: ["advantage", "master", "trappedPiece"] },
                { id: "00BNd", fen: "1rr3k1/3bppbp/3p1np1/1B1N4/P2BP3/5P2/P2R2PP/R5K1 b - - 0 21", rating: 912,  themes: ["advantage", "fork", "short"] },
                { id: "00BPh", fen: "r4rk1/1b1p1p1p/p2NpQpq/1p6/3R4/P7/1P3PPP/3R2K1 b - - 9 23", rating: 1938, themes: ["kingsideAttack", "advantage", "short"] },
                { id: "00BQD", fen: "4r3/3R1pkp/6p1/1P6/1b6/5B2/1P1p1PPP/3R2K1 w - - 0 36", rating: 717,  themes: ["backRankMate", "endgame", "mate"] }
            ];

            // AI가 딥러닝으로 분석한 듯한 그럴싸한 코멘트들
            const reasonPrefixes = [
                "최근 3경기 내 치명적 블런더(Blunder) 패턴과 일치율",
                "CBTI 성향 분석 기반 취약 포지션(Weakness) 유사도",
                "전술형(T) 지표 향상을 위한 강제수(Forcing move) 훈련",
                "자주 놓치는 기물 불균형(Imbalance) 인지 테스트",
                "엔드게임(E) 전환 시점에서의 위상적(TDA) 에러율 기반"
            ];

            const themeMap = {
                "crushing": "압도", "endgame": "엔드게임", "hangingPiece": "기물 방어",
                "advancedPawn": "전진 폰", "promotion": "승진", "advantage": "이점 확보",
                "fork": "포크(양수겸장)", "middlegame": "미들게임", "kingsideAttack": "킹사이드 공격",
                "backRankMate": "백랭크 메이트", "xRayAttack": "엑스레이 공격", "master": "마스터 레벨", "long": "긴 수순"
            };

            // 유저 아이디 기반으로 3개를 랜덤 추출
            let shuffled = [...rawPuzzles].sort(() => rng() - 0.5);
            let selectedPuzzles = shuffled.slice(0, 3); 

            selectedPuzzles.forEach((p, idx) => {
                let displayTheme = p.themes.map(t => themeMap[t] || t).slice(0, 2).join(", ");
                let similarity = (80 + (rng() * 19)).toFixed(1); 
                let reason = reasonPrefixes[Math.floor(rng() * reasonPrefixes.length)];
                let moveNum = Math.floor(rng() * 30) + 12; 
                
                // 체닷 -> 리체스 레이팅 매핑 (선형 변환식 적용된 수치인 척)
                let adjustedRating = Math.floor(1250 + ((p.rating - 550) * (1120 / 1810)));
                if(adjustedRating < 800) adjustedRating = 800;

                list.innerHTML += `
                    <div class="puzzle-card">
                        <div class="puzzle-board-wrapper">
                            <chess-board fen="${p.fen}" interactive="false"></chess-board>
                        </div>
                        <div class="puzzle-info">
                            <h4>실전 매칭 포지션 #${idx + 1} <span class="tag">${displayTheme}</span></h4>
                            <p><strong>분석 근거:</strong> ${reason} <strong>${similarity}%</strong></p>
                            <p><strong>추천 사유:</strong> 최근 기보 ${moveNum}수 시점의 국면과 위상학적으로 매우 유사한 레이팅 ${p.rating} 구간의 전술입니다.</p>
                        </div>
                        <a href="https://lichess.org/training/${p.id}" target="_blank" class="puzzle-btn">해결하기 ↗</a>
                    </div>
                `;
            });
        }

        // ==========================================
        // 네비게이션 제어
        // ==========================================
        function goBack() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('page3').classList.remove('active-flex');
            document.getElementById('main-panel').classList.remove('large');
            document.getElementById('page1').classList.add('active');
            document.getElementById('username').value = '';
            
            document.getElementById('loading-header').style.display = 'block';
            document.getElementById('result-header').style.display = 'none';
            document.getElementById('result-status').innerText = "데이터 수집 중...";
            document.getElementById('loading-view').style.display = 'flex';
            document.getElementById('result-content').style.display = 'none';
        }

        function showHelp() {
            alert(
                "💡 CBTI 스코어 계산 방식\n\n" +
                "1. 기억형(M) vs 직관형(I)\n  - 마스터 레벨 데이터베이스(ATD) 기준 오프닝 이론의 일치율을 측정합니다.\n\n" +
                "2. 전술형(T) vs 전략형(P)\n  - 위상적 데이터 분석(TDA)을 통해 기물 공격망(Homology)의 복잡도를 분석합니다.\n\n" +
                "3. 미들(M) vs 엔드(E)\n  - 스톡피쉬 엔진(CAPS)을 활용해 특정 페이즈에서의 턴별 정확도를 비교 평가합니다.\n\n" +
                "4. 공격형(A) vs 균형형(B)\n  - 기물 불균형(Imbalance) 상태 빈도와 기물 희생 비율을 바탕으로 성향을 판단합니다."
            );
        }

        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') analyzeMockGames();
        });
    </script>
