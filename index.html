<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBTI: Chess Behavioral Type Indicator</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-light: #0b0f19;
            --point-mint: #00FFAA;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(11, 15, 25, 0.65);
            --glass-border: rgba(0, 255, 170, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }

        body {
            background: radial-gradient(circle at 50% 50%, #08241d 0%, var(--bg-light) 60%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---------------------------------------------------
           [1] 패널 기본 및 초기 화면 (Page 1) 
           --------------------------------------------------- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 48px 40px; 
            width: 90%;
            max-width: 440px;   
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 170, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10; 
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        .page.active-flex { display: flex; flex-direction: column; height: 100%; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 초기 화면 텍스트 및 폼 크기 */
        #page1 .main-title {
            font-size: 38px; font-weight: 800; margin-bottom: 6px; text-align: center; letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #page1 .sub-title { font-size: 15px; font-weight: 500; text-align: center; color: var(--text-muted); margin-bottom: 36px; }
        
        #page1 .input-group { position: relative; margin-bottom: 28px; }
        #page1 .input-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 10px; }
        #page1 .input-label span { color: var(--point-mint); }

        #page1 input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-main); font-size: 16px; padding: 16px; outline: none; transition: all 0.3s;
        }
        #page1 input[type="text"]:focus { border-color: var(--point-mint); box-shadow: 0 0 15px rgba(0, 255, 170, 0.15); }

        #page1 button.primary-btn {
            width: 100%; background: var(--point-mint); color: #05070a; border: none; padding: 18px;
            font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }
        #page1 button.primary-btn:hover { transform: translateY(-2px); background: #1affb8; box-shadow: 0 8px 25px rgba(0, 255, 170, 0.4); }
        #page1 button.primary-btn:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }


        /* ---------------------------------------------------
           [2] 결과 화면 (Page 2) - 컴팩트 사이즈 유지 및 헤더 변경
           --------------------------------------------------- */
        .glass-panel.large { 
            max-width: 720px; 
            height: auto;
            max-height: 80vh; 
            padding: 24px 28px;  
        }

        /* 로딩 중 제목(가운데 정렬) */
        #loading-header { text-align: center; }
        #loading-header .main-title { 
            font-size: 18px; font-weight: 800; letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2px; 
        }
        #loading-header .sub-title { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 0; }

        /* 결과 표시용 헤더 (좌우 분할) */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4px;
            padding: 0 6px 12px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .result-user {
            font-size: 16px; 
            font-weight: 600; 
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .result-type {
            font-size: 22px; 
            font-weight: 900; 
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        /* 결과 화면 하단 레이아웃 */
        .content-body {
            display: flex;
            gap: 16px;
            flex: 1;
            overflow: hidden;
            margin-top: 10px;
        }

        .left-col {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            gap: 8px; 
            overflow-y: auto;
            padding-right: 4px;
        }

        .right-col {
            flex: 0.9;
            display: flex;
            flex-direction: column;
            gap: 8px; 
        }

        /* MBTI 스타일 스코어 바 디자인 (초미니멀 사이즈) */
        .trait-row {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px; 
        }
        .trait-title { text-align: center; font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .trait-title span.vs { color: #8b95a5; font-size: 10px; font-weight: 400; margin: 0 4px; }
        .trait-desc { text-align: center; font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }

        .trait-labels { display: flex; justify-content: space-between; margin-bottom: 4px; align-items: flex-end; }
        .trait-labels span { font-size: 13px; font-weight: 800; line-height: 1.1; }
        .trait-labels small { font-size: 9px; font-weight: 500; display: block; margin-top: 1px; text-transform: uppercase; }

        .bar-container {
            display: flex;
            height: 5px; 
            border-radius: 2.5px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }
        .bar-segment { transition: width 1s cubic-bezier(0.25, 0.8, 0.25, 1); }

        /* 우측 액션 버튼 */
        .action-card {
            flex: 1; 
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            display: flex;
            flex-direction: row; 
            align-items: center;
            text-align: left;
            padding: 12px 16px; 
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-main);
        }
        .action-card:hover {
            background: rgba(0, 255, 170, 0.08);
            border-color: var(--point-mint);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 170, 0.15);
        }
        .action-icon { font-size: 22px; flex-shrink: 0; }
        .action-text { display: flex; flex-direction: column; }
        .action-text h3 { font-size: 12px; font-weight: 700; color: var(--point-mint); margin-bottom: 3px; }
        .action-text p { font-size: 10px; color: var(--text-muted); line-height: 1.4; word-break: keep-all;}

        /* 하단 버튼 그룹 */
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .secondary-btn { 
            flex: 1;
            background: transparent; 
            border: 1px solid var(--text-muted); 
            color: var(--text-muted); 
            padding: 10px 6px; 
            font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
        }
        .secondary-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        
        .help-btn { border-color: rgba(0, 255, 170, 0.4); color: var(--point-mint); }
        .help-btn:hover { background: rgba(0, 255, 170, 0.1); border-color: var(--point-mint); }

        .loading-view { text-align: center; padding: 20px 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .loading-view p { color: var(--point-mint); font-size: 13px; margin-bottom: 4px; font-weight: 600;}
        .loading-view span { color: var(--text-muted); font-size: 10px; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 170, 0.5); }

        @media (max-width: 768px) {
            .content-body { flex-direction: column; overflow-y: auto; gap: 12px;}
            .left-col { overflow-y: visible; padding-right: 0; }
            .right-col { flex: none; }
            .action-card { min-height: 90px; }
            .glass-panel.large { max-height: 90vh; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="glass-panel" id="main-panel">
        <!-- PAGE 1: 큼직한 초기 검색 화면 -->
        <div id="page1" class="page active">
            <h1 class="main-title">CBTI</h1>
            <h2 class="sub-title">Chess Behavioral Type Indicator</h2>
            
            <div class="input-group">
                <label class="input-label">Type your <span>Chess ID</span></label>
                <input type="text" id="username" placeholder="e.g. hikaru" autocomplete="off">
            </div>
            
            <button class="primary-btn" id="fetch-btn" onclick="analyzeMockGames()">기보 분석하기</button>
        </div>

        <!-- PAGE 2: 밀도 있게 축소된 결과 화면 -->
        <div id="page2" class="page">
            
            <!-- 로딩 중일 때 보여지는 중앙 헤더 -->
            <div id="loading-header">
                <h1 class="main-title" id="loading-user"></h1>
                <p class="sub-title" id="result-status">데이터 수집 중...</p>
            </div>

            <!-- 분석 완료 시 보여지는 좌우 분할 헤더 -->
            <div class="result-header" id="result-header" style="display: none;">
                <div class="result-user" id="display-user"></div>
                <div class="result-type" id="display-type"></div>
            </div>
            
            <div id="loading-view" class="loading-view">
                <p>♟️ Chess.com 아카이브 탐색 중...</p>
                <span>최근 기보를 기반으로 플레이 스타일을 스캔합니다.</span>
            </div>

            <div id="result-content" class="content-body" style="display: none;">
                <!-- 좌측: MBTI 그래프 영역 -->
                <div class="left-col" id="result-container"></div>

                <!-- 우측: 배너 및 버튼 영역 -->
                <div class="right-col">
                    <div class="action-card" onclick="alert('오프닝 추천 페이지 준비중입니다!')">
                        <div class="action-icon">📖</div>
                        <div class="action-text">
                            <h3>맞춤형 오프닝 추천</h3>
                            <p>당신의 CBTI 성향에 가장 어울리는 최적의 오프닝을 확인하세요.</p>
                        </div>
                    </div>
                    
                    <div class="action-card" onclick="alert('퍼즐 큐레이션 페이지 준비중입니다!')">
                        <div class="action-icon">🧩</div>
                        <div class="action-text">
                            <h3>최적의 퍼즐 큐레이션</h3>
                            <p>취약점을 보완하고 강점을 극대화할 맞춤형 전술 훈련을 시작하세요.</p>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="secondary-btn" onclick="goBack()">다른 ID 검색</button>
                        <button class="secondary-btn help-btn" onclick="showHelp()">💡 계산 방식 안내</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 문자열을 해시(정수)로 변환 (고정 시드)
        function getStringHash(str) {
            let hash = 0;
            str = str.toLowerCase();
            for (let i = 0; i < str.length; i++) {
                hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
            }
            return hash;
        }

        // 고정 시드 난수 생성 (Mulberry32)
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        async function analyzeMockGames() {
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return alert("Chess ID를 입력해주세요.");

            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "분석 중...";

            // 화면 전환
            document.getElementById('page1').classList.remove('active');
            const page2 = document.getElementById('page2');
            page2.classList.add('active-flex');
            document.getElementById('main-panel').classList.add('large');
            
            // 로딩 상태에서 대소문자 원본 그대로 출력
            document.getElementById('loading-user').innerText = usernameInput;
            
            const loadingHeader = document.getElementById('loading-header');
            const resultHeader = document.getElementById('result-header');
            const loadingView = document.getElementById('loading-view');
            const resultContent = document.getElementById('result-content');
            const container = document.getElementById('result-container');

            document.getElementById('result-status').innerText = "최근 플레이 스타일을 분석하고 있습니다...";
            
            // UI 초기 세팅
            loadingHeader.style.display = 'block';
            resultHeader.style.display = 'none';
            loadingView.style.display = 'flex';
            resultContent.style.display = 'none';
            container.innerHTML = '';

            await new Promise(r => setTimeout(r, 1200));

            try {
                // ID 기반 랜덤 제너레이터 초기화
                const seed = getStringHash(usernameInput);
                const rng = mulberry32(seed);

                // 정규 분포화 (중간값 50 수렴)
                const getGaussianScore = () => {
                    const val = (rng() + rng()) / 2;
                    return Math.floor(val * 101);
                };

                // 각 축별 데이터 및 성향 알파벳 설정
                const axesData = [
                    { leftTitle: "기억형(M)", rightTitle: "직관형(I)", desc: "오프닝 이론 숙지도 깊이", color: "#00FFAA", letters: ['M', 'I'] },
                    { leftTitle: "전술형(T)", rightTitle: "전략형(P)", desc: "위상적 복잡도 선호도 (TDA)", color: "#F4A261", letters: ['T', 'P'] },
                    { leftTitle: "미들(M)", rightTitle: "엔드(E)", desc: "페이즈별 강점 (M-Score)", color: "#2A9D8F", letters: ['M', 'E'] },
                    { leftTitle: "공격형(A)", rightTitle: "균형형(B)", desc: "희생 빈도 및 불균형 비율", color: "#CDB4DB", letters: ['A', 'B'] }
                ];

                let html = '';
                let cbtiTypeString = ''; // 결과 유형 문자열 (예: MTMA)

                axesData.forEach(axis => {
                    const scoreLeft = getGaussianScore();
                    const scoreRight = 100 - scoreLeft;
                    const isLeftDominant = scoreLeft >= scoreRight;

                    // 결과 유형 문자열 누적
                    cbtiTypeString += isLeftDominant ? axis.letters[0] : axis.letters[1];

                    const leftBgColor = isLeftDominant ? axis.color : 'rgba(255,255,255,0.05)';
                    const rightBgColor = !isLeftDominant ? axis.color : 'rgba(255,255,255,0.05)';
                    const leftTextColor = isLeftDominant ? axis.color : '#8b95a5';
                    const rightTextColor = !isLeftDominant ? axis.color : '#8b95a5';

                    html += `
                        <div class="trait-row">
                            <div class="trait-title">${axis.leftTitle} <span class="vs">vs</span> ${axis.rightTitle}</div>
                            <div class="trait-desc">${axis.desc}</div>
                            
                            <div class="trait-labels">
                                <span style="color: ${leftTextColor}; text-align: left;">
                                    ${scoreLeft}%<br><small>${axis.leftTitle.replace(/\(.*\)/,'')}</small>
                                </span>
                                <span style="color: ${rightTextColor}; text-align: right;">
                                    ${scoreRight}%<br><small>${axis.rightTitle.replace(/\(.*\)/,'')}</small>
                                </span>
                            </div>
                            
                            <div class="bar-container">
                                <div class="bar-segment" style="width: ${scoreLeft}%; background: ${leftBgColor};"></div>
                                <div class="bar-segment" style="width: ${scoreRight}%; background: ${rightBgColor};"></div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                
                // 완료 후 헤더 및 뷰 전환
                loadingHeader.style.display = 'none';
                resultHeader.style.display = 'flex';
                document.getElementById('display-user').innerText = usernameInput;
                document.getElementById('display-type').innerText = cbtiTypeString;

                loadingView.style.display = 'none';
                resultContent.style.display = 'flex';

            } catch (error) {
                document.getElementById('result-status').innerText = "분석 중 오류가 발생했습니다.";
                loadingView.innerHTML = `<div style="color: #ff4a4a; font-weight:600;">데이터를 불러오지 못했습니다.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "기보 분석하기";
            }
        }

        function goBack() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('main-panel').classList.remove('large');
            document.getElementById('page1').classList.add('active');
            document.getElementById('username').value = '';
            
            // 상태 초기화
            document.getElementById('loading-header').style.display = 'block';
            document.getElementById('result-header').style.display = 'none';
            document.getElementById('result-status').innerText = "데이터 수집 중...";
            document.getElementById('loading-view').style.display = 'flex';
            document.getElementById('result-content').style.display = 'none';
        }

        function showHelp() {
            alert(
                "💡 CBTI 스코어 계산 방식\n\n" +
                "1. 기억형(M) vs 직관형(I)\n  - 마스터 레벨 데이터베이스(ATD) 기준 오프닝 이론의 일치율을 측정합니다.\n\n" +
                "2. 전술형(T) vs 전략형(P)\n  - 위상적 데이터 분석(TDA)을 통해 기물 공격망(Homology)의 복잡도를 분석합니다.\n\n" +
                "3. 미들(M) vs 엔드(E)\n  - 스톡피쉬 엔진(CAPS)을 활용해 특정 페이즈에서의 턴별 정확도를 비교 평가합니다.\n\n" +
                "4. 공격형(A) vs 균형형(B)\n  - 기물 불균형(Imbalance) 상태 빈도와 기물 희생 비율을 바탕으로 성향을 판단합니다."
            );
        }

        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') analyzeMockGames();
        });
    </script>
</body>
</html>
