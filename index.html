<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBTI: Chess Behavioral Type Indicator</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-light: #0b0f19;
            --point-mint: #00FFAA;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(11, 15, 25, 0.65);
            --glass-border: rgba(0, 255, 170, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }

        body {
            background: radial-gradient(circle at 50% 50%, #08241d 0%, var(--bg-light) 60%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 170, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10; 
        }

        .glass-panel.large { 
            max-width: 800px; 
            height: 80vh; 
            display: flex; 
            flex-direction: column; 
            padding: 32px; 
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        .page.active-flex { display: flex; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .main-title {
            font-size: 42px; font-weight: 800; margin-bottom: 4px; text-align: center; letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sub-title { font-size: 15px; font-weight: 500; text-align: center; color: var(--text-muted); margin-bottom: 40px; }

        .input-group { position: relative; margin-bottom: 32px; }
        .input-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
        .input-label span { color: var(--point-mint); }

        input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-main); font-size: 16px; padding: 16px; outline: none; transition: all 0.3s;
        }
        input[type="text"]:focus { border-color: var(--point-mint); box-shadow: 0 0 15px rgba(0, 255, 170, 0.15); }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.2); }

        button {
            width: 100%; background: var(--point-mint); color: #05070a; border: none; padding: 18px;
            font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }
        button:hover { transform: translateY(-2px); background: #1affb8; box-shadow: 0 8px 25px rgba(0, 255, 170, 0.4); }
        button:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }

        .back-btn { 
            background: transparent; 
            border: 1px solid var(--point-mint); 
            color: var(--point-mint); 
            box-shadow: none; 
            margin-top: 20px;
        }
        .back-btn:hover { background: rgba(0, 255, 170, 0.1); color: var(--point-mint); box-shadow: none; }

        /* 결과 창 전용 디자인 */
        #result-container {
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.4); 
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; 
            padding: 24px; 
            margin-top: 20px;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        
        .score-title { font-size: 16px; font-weight: 600; color: #d1d5db; line-height: 1.4; }
        .score-title span { font-size: 12px; font-weight: 400; color: #8b95a5; display: block; margin-top: 4px; }
        .score-value { font-size: 28px; font-weight: 800; color: var(--point-mint); }
        .loading-spinner { text-align: center; color: var(--point-mint); font-size: 16px; padding: 40px; line-height: 1.6; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 170, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--point-mint); }
    </style>
</head>
<body>

    <div class="glass-panel" id="main-panel">
        <div id="page1" class="page active">
            <h1 class="main-title">CBTI</h1>
            <h2 class="sub-title">Chess Behavioral Type Indicator</h2>
            
            <div class="input-group">
                <label class="input-label">Type your <span>Chess ID</span></label>
                <input type="text" id="username" placeholder="e.g. hikaru" autocomplete="off">
            </div>
            
            <button id="fetch-btn" onclick="fetchGames()">기보 분석하기</button>
        </div>

        <div id="page2" class="page">
            <h1 class="main-title" style="font-size: 28px;" id="display-user"></h1>
            <p class="sub-title" style="margin-bottom: 0;" id="result-status">데이터를 분석하는 중입니다...</p>
            
            <div id="result-container">
                </div>

            <button class="back-btn" onclick="goBack()">다시 검색하기</button>
        </div>
    </div>

    <script>
        async function fetchGames() {
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return alert("Chess ID를 입력해주세요.");

            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "분석 준비 중...";

            // UI를 페이지 2로 전환 (넓은 창)
            document.getElementById('page1').classList.remove('active');
            const page2 = document.getElementById('page2');
            page2.classList.add('active-flex');
            document.getElementById('main-panel').classList.add('large');
            document.getElementById('display-user').innerText = usernameInput.toUpperCase();
            
            const status = document.getElementById('result-status');
            const container = document.getElementById('result-container');
            
            // 1단계 로딩 UI
            container.innerHTML = '<div class="loading-spinner">♟️ Chess.com에서 최신 기보를 수집하고 있습니다...</div>';

            try {
                // 1. Chess.com 아카이브 조회
                const headers = { 'User-Agent': 'CBTI_Prototype/1.0' };
                const archiveRes = await fetch(`https://api.chess.com/pub/player/${usernameInput}/games/archives`, { headers });
                if (!archiveRes.ok) throw new Error("입력하신 ID를 찾을 수 없습니다.");
                
                const archiveData = await archiveRes.json();
                const archives = archiveData.archives || [];
                if (archives.length === 0) throw new Error("최근 플레이한 게임 기록이 없습니다.");

                // 2. 가장 최근 기보 1개 추출
                let recentGames = [];
                for (let i = archives.length - 1; i >= 0; i--) {
                    const monthRes = await fetch(archives[i], { headers });
                    if (monthRes.ok) {
                        const monthData = await monthRes.json();
                        let games = monthData.games || [];
                        games.reverse(); // 최신순 정렬
                        recentGames = recentGames.concat(games);
                        if (recentGames.length >= 1) break;
                    }
                }

                recentGames = recentGames.slice(0, 1); // 최신 1개 게임만 사용
                if (recentGames.length === 0) throw new Error("기보를 추출하지 못했습니다.");

                let combinedPGN = recentGames.map(g => g.pgn).join('\n\n');

                // 2단계 로딩 UI (엔진 분석 시작)
                container.innerHTML = '<div class="loading-spinner">⚙️ 기보 수집 완료!<br>파이썬 백엔드(Stockfish)가 4개의 축을 연산 중입니다.<br><br><span style="font-size:13px; color:#8b95a5;">(TDA 및 위상 수학 연산으로 인해 약 10~20초 소요될 수 있습니다)</span></div>';
                
                // 3. Render.com 백엔드 서버로 데이터 전송 및 분석 요청
                // ==============================================================================
                // 🚨 [필수 수정] 아래의 URL을 Render.com에서 생성된 본인의 웹 서비스 주소로 바꾸세요!
                // 예시: 'https://cbti-backend-xxxx.onrender.com/api/evaluate'
                // ==============================================================================
                const RENDER_API_URL = 'https://chessapi-tzn8.onrender.com/api/evaluate';
                
                const response = await fetch(RENDER_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pgn: combinedPGN, username: usernameInput })
                });

                if (!response.ok) throw new Error("백엔드 서버 분석 중 오류가 발생했습니다. 서버 상태를 확인해주세요.");
                
                const scores = await response.json();
                if (scores.error) throw new Error(scores.error);

                // 4. 결과 스코어 카드 렌더링
                status.innerText = "최근 경기들의 CBTI 분석이 완료되었습니다.";
                container.innerHTML = `
                    <div class="score-card">
                        <div class="score-title">1. 기억형(M) vs 직관형(I) <span>오프닝 이론 숙지도 깊이 (ATD)</span></div>
                        <div class="score-value">${scores.Axis1_Memory.toFixed(2)}</div>
                    </div>
                    <div class="score-card">
                        <div class="score-title">2. 전술형(T) vs 전략형(P) <span>TDA 위상적 복잡도 (H1 Homology)</span></div>
                        <div class="score-value">${scores.Axis2_Tactical.toFixed(4)}</div>
                    </div>
                    <div class="score-card">
                        <div class="score-title">3. 미들(M) vs 엔드(E) 강자 <span>M-Score (CAPS 엔진 정확도 기반)</span></div>
                        <div class="score-value">${scores.Axis3_Middlegame.toFixed(1)}%</div>
                    </div>
                    <div class="score-card">
                        <div class="score-title">4. 공격형(A) vs 균형형(B) <span>희생 빈도 및 기물 불균형 점수 (TDA)</span></div>
                        <div class="score-value">${scores.Axis4_Aggressive.toFixed(1)}</div>
                    </div>
                `;

            } catch (error) {
                status.innerText = "분석 실패";
                container.innerHTML = `<div style="color: #ff4a4a; padding: 20px; text-align: center; line-height: 1.5;">${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "기보 분석하기";
            }
        }

        function goBack() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('main-panel').classList.remove('large');
            document.getElementById('page1').classList.add('active');
            document.getElementById('username').value = '';
        }

        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fetchGames();
        });
    </script>
</body>
</html>
