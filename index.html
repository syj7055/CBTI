<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBTI: Chess Behavioral Type Indicator</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-light: #0b0f19;
            --point-mint: #00FFAA;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(11, 15, 25, 0.65);
            --glass-border: rgba(0, 255, 170, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }

        body {
            background: radial-gradient(circle at 50% 50%, #08241d 0%, var(--bg-light) 60%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 170, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10; 
        }

        .glass-panel.large { 
            max-width: 900px; /* 좌우 분할을 위해 더 넓게 설정 */
            height: 85vh; 
            display: flex; 
            flex-direction: column; 
            padding: 40px; 
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        .page.active-flex { display: flex; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .main-title {
            font-size: 42px; font-weight: 800; margin-bottom: 4px; text-align: center; letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sub-title { font-size: 15px; font-weight: 500; text-align: center; color: var(--text-muted); margin-bottom: 40px; }

        .input-group { position: relative; margin-bottom: 32px; }
        .input-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
        .input-label span { color: var(--point-mint); }

        input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-main); font-size: 16px; padding: 16px; outline: none; transition: all 0.3s;
        }
        input[type="text"]:focus { border-color: var(--point-mint); box-shadow: 0 0 15px rgba(0, 255, 170, 0.15); }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.2); }

        button.primary-btn {
            width: 100%; background: var(--point-mint); color: #05070a; border: none; padding: 18px;
            font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }
        button.primary-btn:hover { transform: translateY(-2px); background: #1affb8; box-shadow: 0 8px 25px rgba(0, 255, 170, 0.4); }
        button.primary-btn:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }

        /* 결과 화면 레이아웃 (좌우 분할) */
        .content-body {
            display: flex;
            gap: 32px;
            flex: 1;
            overflow: hidden;
            margin-top: 24px;
        }

        .left-col {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
            padding-right: 12px;
        }

        .right-col {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* MBTI 스타일 스코어 바 디자인 */
        .trait-row {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
        }
        .trait-title { text-align: center; font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .trait-title span.vs { color: #8b95a5; font-size: 14px; font-weight: 400; margin: 0 8px; }
        .trait-desc { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

        .trait-labels { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: flex-end; }
        .trait-labels span { font-size: 20px; font-weight: 800; line-height: 1.2; }
        .trait-labels small { font-size: 13px; font-weight: 500; display: block; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px;}

        .bar-container {
            display: flex;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05); /* 기본 빈 영역 색상 */
        }
        .bar-segment { transition: width 1s cubic-bezier(0.25, 0.8, 0.25, 1); }

        /* 우측 액션 버튼 (오프닝 / 퍼즐) */
        .action-card {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-main);
        }
        .action-card:hover {
            background: rgba(0, 255, 170, 0.08);
            border-color: var(--point-mint);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 255, 170, 0.15);
        }
        .action-icon { font-size: 32px; margin-bottom: 12px; }
        .action-card h3 { font-size: 18px; font-weight: 700; color: var(--point-mint); margin-bottom: 8px; }
        .action-card p { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

        .back-btn { 
            background: transparent; 
            border: 1px solid var(--text-muted); 
            color: var(--text-muted); 
            padding: 16px;
            font-size: 15px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            margin-top: auto;
        }
        .back-btn:hover { border-color: var(--text-main); color: var(--text-main); }

        .loading-view { text-align: center; padding: 60px 0; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .loading-view p { color: var(--point-mint); font-size: 18px; margin-bottom: 12px; font-weight: 600;}
        .loading-view span { color: var(--text-muted); font-size: 14px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 255, 170, 0.5); }

        @media (max-width: 768px) {
            .content-body { flex-direction: column; overflow-y: auto; gap: 20px;}
            .left-col { overflow-y: visible; padding-right: 0; }
            .right-col { flex: none; gap: 12px; }
            .action-card { min-height: 140px; }
        }
    </style>
</head>
<body>

    <div class="glass-panel" id="main-panel">
        <div id="page1" class="page active">
            <h1 class="main-title">CBTI</h1>
            <h2 class="sub-title">Chess Behavioral Type Indicator</h2>
            
            <div class="input-group">
                <label class="input-label">Type your <span>Chess ID</span></label>
                <input type="text" id="username" placeholder="e.g. hikaru" autocomplete="off">
            </div>
            
            <button class="primary-btn" id="fetch-btn" onclick="analyzeMockGames()">기보 분석하기</button>
        </div>

        <div id="page2" class="page">
            <h1 class="main-title" style="font-size: 28px;" id="display-user"></h1>
            <p class="sub-title" style="margin-bottom: 0;" id="result-status">데이터 수집 중...</p>
            
            <div id="loading-view" class="loading-view">
                <p>♟️ Chess.com 아카이브를 탐색하고 있습니다...</p>
                <span>최근 기보를 기반으로 플레이 스타일을 스캔합니다.</span>
            </div>

            <div id="result-content" class="content-body" style="display: none;">
                <div class="left-col" id="result-container">
                    </div>

                <div class="right-col">
                    <div class="action-card" onclick="alert('오프닝 추천 페이지 준비중입니다!')">
                        <div class="action-icon">📖</div>
                        <h3>맞춤형 오프닝 추천</h3>
                        <p>당신의 CBTI 성향에 가장 <br>어울리는 오프닝을 확인하세요</p>
                    </div>
                    
                    <div class="action-card" onclick="alert('퍼즐 큐레이션 페이지 준비중입니다!')">
                        <div class="action-icon">🧩</div>
                        <h3>최적의 퍼즐 큐레이션</h3>
                        <p>취약점을 보완하고 강점을 극대화할<br>맞춤형 전술 훈련을 시작하세요</p>
                    </div>

                    <button class="back-btn" onclick="goBack()">다른 ID 검색하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 백엔드 연동 없이 랜덤 값을 출력하는 테스트 함수
        async function analyzeMockGames() {
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return alert("Chess ID를 입력해주세요.");

            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "분석 중...";

            // UI를 페이지 2로 전환 (넓은 창)
            document.getElementById('page1').classList.remove('active');
            const page2 = document.getElementById('page2');
            page2.classList.add('active-flex');
            document.getElementById('main-panel').classList.add('large');
            document.getElementById('display-user').innerText = usernameInput.toUpperCase();
            
            const status = document.getElementById('result-status');
            const loadingView = document.getElementById('loading-view');
            const resultContent = document.getElementById('result-content');
            const container = document.getElementById('result-container');

            // 초기 상태 세팅
            status.innerText = "최근 플레이 스타일을 분석하고 있습니다...";
            loadingView.style.display = 'flex';
            resultContent.style.display = 'none';
            container.innerHTML = '';

            // 가짜 딜레이 (분석하는 척 1.5초 대기)
            await new Promise(r => setTimeout(r, 1500));

            try {
                // 각 축별 데이터 및 테마 색상 설정
                const axesData = [
                    { leftTitle: "기억형(M)", rightTitle: "직관형(I)", desc: "오프닝 이론 숙지도 깊이", color: "#00FFAA" },
                    { leftTitle: "전술형(T)", rightTitle: "전략형(P)", desc: "위상적 복잡도 선호도 (TDA)", color: "#F4A261" },
                    { leftTitle: "미들(M)", rightTitle: "엔드(E)", desc: "페이즈별 강점 (M-Score)", color: "#2A9D8F" },
                    { leftTitle: "공격형(A)", rightTitle: "균형형(B)", desc: "희생 빈도 및 기물 불균형 비율", color: "#CDB4DB" }
                ];

                let html = '';

                axesData.forEach(axis => {
                    // 0~100 사이 랜덤 스코어 생성
                    const scoreLeft = Math.floor(Math.random() * 101);
                    const scoreRight = 100 - scoreLeft;
                    
                    // 더 높은 쪽(Dominant) 계산
                    const isLeftDominant = scoreLeft >= scoreRight;

                    // 우세한 쪽에만 색상을 부여하고, 열세인 쪽은 어두운 회색 유지
                    const leftBgColor = isLeftDominant ? axis.color : 'rgba(255,255,255,0.05)';
                    const rightBgColor = !isLeftDominant ? axis.color : 'rgba(255,255,255,0.05)';
                    
                    const leftTextColor = isLeftDominant ? axis.color : '#8b95a5';
                    const rightTextColor = !isLeftDominant ? axis.color : '#8b95a5';

                    html += `
                        <div class="trait-row">
                            <div class="trait-title">${axis.leftTitle} <span class="vs">vs</span> ${axis.rightTitle}</div>
                            <div class="trait-desc">${axis.desc}</div>
                            
                            <div class="trait-labels">
                                <span style="color: ${leftTextColor}; text-align: left;">
                                    ${scoreLeft}%<br><small>${axis.leftTitle.replace(/\(.*\)/,'')}</small>
                                </span>
                                <span style="color: ${rightTextColor}; text-align: right;">
                                    ${scoreRight}%<br><small>${axis.rightTitle.replace(/\(.*\)/,'')}</small>
                                </span>
                            </div>
                            
                            <div class="bar-container">
                                <div class="bar-segment" style="width: ${scoreLeft}%; background: ${leftBgColor};"></div>
                                <div class="bar-segment" style="width: ${scoreRight}%; background: ${rightBgColor};"></div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                
                status.innerText = "분석이 성공적으로 완료되었습니다.";
                loadingView.style.display = 'none';
                resultContent.style.display = 'flex';

            } catch (error) {
                status.innerText = "분석 중 오류가 발생했습니다.";
                loadingView.innerHTML = `<div style="color: #ff4a4a; font-weight:600;">데이터를 불러오지 못했습니다.</div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "기보 분석하기";
            }
        }

        // 뒤로가기 (초기화)
        function goBack() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('main-panel').classList.remove('large');
            document.getElementById('page1').classList.add('active');
            document.getElementById('username').value = '';
            
            // 상태 텍스트 및 뷰 초기화
            document.getElementById('result-status').innerText = "데이터 수집 중...";
            document.getElementById('loading-view').style.display = 'flex';
            document.getElementById('result-content').style.display = 'none';
        }

        // 엔터키 입력 지원
        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') analyzeMockGames();
        });
    </script>
</body>
</html>
