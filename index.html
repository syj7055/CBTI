<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBTI: Chess Behavioral Type Indicator</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-light: #0b0f19;
            --point-mint: #00FFAA;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(11, 15, 25, 0.65);
            --glass-border: rgba(0, 255, 170, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }

        body {
            /* 3D 오브젝트가 빠진 대신 배경 그라데이션을 중앙 중심으로 배치하여 몰입감을 높였습니다 */
            background: radial-gradient(circle at 50% 50%, #08241d 0%, var(--bg-light) 60%, var(--bg-dark) 100%);
            color: var(--text-main);
            overflow: hidden; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px 40px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 255, 170, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10; 
        }

        .glass-panel.large { max-width: 800px; height: 80vh; display: flex; flex-direction: column; padding: 32px; }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }
        .page.active-flex { display: flex; flex-direction: column; height: 100%; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .main-title {
            font-size: 42px; font-weight: 800; margin-bottom: 4px; text-align: center; letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--point-mint));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sub-title { font-size: 15px; font-weight: 500; text-align: center; color: var(--text-muted); margin-bottom: 40px; }

        .input-group { position: relative; margin-bottom: 32px; }
        .input-label { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
        .input-label span { color: var(--point-mint); }

        input[type="text"] {
            width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-main); font-size: 16px; padding: 16px; outline: none; transition: all 0.3s;
        }
        input[type="text"]:focus { border-color: var(--point-mint); box-shadow: 0 0 15px rgba(0, 255, 170, 0.15); }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.2); }

        button {
            width: 100%; background: var(--point-mint); color: #05070a; border: none; padding: 18px;
            font-size: 16px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }
        button:hover { transform: translateY(-2px); background: #1affb8; box-shadow: 0 8px 25px rgba(0, 255, 170, 0.4); }
        button:disabled { background: #333; color: #777; box-shadow: none; cursor: not-allowed; transform: none; }

        #result-container {
            flex: 1; overflow-y: auto; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 20px; margin-bottom: 24px; margin-top: 20px;
        }
        pre { font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #d1d5db; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }

        .back-btn { background: transparent; border: 1px solid var(--point-mint); color: var(--point-mint); box-shadow: none; }
        .back-btn:hover { background: rgba(0, 255, 170, 0.1); color: var(--point-mint); box-shadow: none; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 255, 170, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--point-mint); }
    </style>
</head>
<body>

    <div class="glass-panel" id="main-panel">
        <div id="page1" class="page active">
            <h1 class="main-title">CBTI</h1>
            <h2 class="sub-title">Chess Behavioral Type Indicator</h2>
            
            <div class="input-group">
                <label class="input-label">Type your <span>Chess ID</span></label>
                <input type="text" id="username" placeholder="e.g. hikaru" autocomplete="off">
            </div>
            
            <button id="fetch-btn" onclick="fetchGames()">기보 가져오기</button>
        </div>

        <div id="page2" class="page">
            <h1 class="main-title" style="font-size: 28px;" id="display-user"></h1>
            <p class="sub-title" style="margin-bottom: 0;" id="result-status">데이터를 불러오는 중입니다...</p>
            <div id="result-container"><pre id="pgn-output"></pre></div>
            <button class="back-btn" onclick="goBack()">다시 검색하기</button>
        </div>
    </div>

    <script>
        /* ==========================================
           API 로직 (수집, 파싱, 에러 처리)
        ========================================== */
        async function fetchGames() {
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return alert("Chess ID를 입력해주세요.");

            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "불러오는 중...";

            document.getElementById('page1').classList.remove('active');
            const page2 = document.getElementById('page2');
            page2.classList.add('active-flex');
            document.getElementById('main-panel').classList.add('large');
            
            document.getElementById('display-user').innerText = usernameInput.toUpperCase();
            const output = document.getElementById('pgn-output');
            const status = document.getElementById('result-status');
            
            output.innerText = "";
            status.innerText = "아카이브를 탐색하고 있습니다...";

            const headers = { 'User-Agent': 'CBTI_Prototype/1.0' };

            try {
                const archiveRes = await fetch(`https://api.chess.com/pub/player/${usernameInput}/games/archives`, { headers });
                if (!archiveRes.ok) throw new Error("ID를 찾을 수 없습니다.");
                
                const archiveData = await archiveRes.json();
                const archives = archiveData.archives || [];
                
                if (archives.length === 0) {
                    status.innerText = "최근 플레이한 게임 기록이 없습니다.";
                    btn.disabled = false;
                    btn.innerText = "기보 가져오기";
                    return;
                }

                let allGames = [];
                status.innerText = "기보를 추출하는 중입니다...";

                for (let i = archives.length - 1; i >= 0; i--) {
                    const monthRes = await fetch(archives[i], { headers });
                    if (monthRes.ok) {
                        const monthData = await monthRes.json();
                        let games = monthData.games || [];
                        games.reverse(); 
                        allGames = allGames.concat(games);
                        if (allGames.length >= 100) break;
                    }
                }

                const recentGames = allGames.slice(0, 100);
                status.innerText = `성공! 총 ${recentGames.length}개의 기보를 가져왔습니다.`;
                
                let resultText = "";
                recentGames.forEach((game, index) => {
                    resultText += `[Game ${index + 1}] FIDE: ${game.rules} | TimeClass: ${game.time_class}\n`;
                    resultText += `${game.pgn}\n\n`;
                    resultText += `==================================================\n\n`;
                });

                output.innerText = resultText;

            } catch (error) {
                status.innerText = `오류: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.innerText = "기보 가져오기";
            }
        }

        function goBack() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('main-panel').classList.remove('large');
            document.getElementById('page1').classList.add('active');
            document.getElementById('username').value = '';
        }

        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fetchGames();
        });
    </script>
</body>
</html>
