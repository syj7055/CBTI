<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBTI - Chess PGN Fetcher</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --point-mint: #00FFAA;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(11, 15, 25, 0.6);
            --glass-border: rgba(0, 255, 170, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden; /* 3D 캔버스 스크롤 방지 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D 배경 컨테이너 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 메인 UI 글래스모피즘 컨테이너 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            position: relative;
        }

        .glass-panel.large {
            max-width: 800px;
            height: 80vh;
            display: flex;
            flex-direction: column;
        }

        /* 페이지 전환용 클래스 */
        .page { display: none; }
        .page.active { display: block; }
        .page.active-flex { display: flex; flex-direction: column; height: 100%; }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .highlight {
            color: var(--point-mint);
        }

        /* 입력 폼 스타일 */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            font-size: 18px;
            padding: 12px 0;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-bottom-color: var(--point-mint);
        }

        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            background: var(--point-mint);
            color: var(--bg-color);
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 170, 0.5);
        }

        button:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 2페이지 결과 영역 */
        #result-container {
            flex: 1;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        pre {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #d1d5db;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--point-mint);
            color: var(--point-mint);
            box-shadow: none;
        }
        .back-btn:hover {
            background: rgba(0, 255, 170, 0.1);
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--point-mint); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="glass-panel" id="main-panel">
        
        <div id="page1" class="page active">
            <h1>Type your <span class="highlight">Chess ID</span></h1>
            <p class="subtitle">CBTI 성향 분석을 위한 최근 100경기 기보 수집</p>
            
            <div class="input-group">
                <input type="text" id="username" placeholder="e.g. hikaru" autocomplete="off">
            </div>
            
            <button id="fetch-btn" onclick="fetchGames()">기보 가져오기</button>
        </div>

        <div id="page2" class="page">
            <h1><span class="highlight" id="display-user"></span>'s Games</h1>
            <p class="subtitle" id="result-status">데이터를 불러오는 중입니다...</p>
            
            <div id="result-container">
                <pre id="pgn-output"></pre>
            </div>
            
            <button class="back-btn" onclick="goBack()">다시 검색하기</button>
        </div>

    </div>

    <script>
        /* ==========================================
           1. Three.js 3D 폰(Pawn) 배경 애니메이션 
        ========================================== */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // 안개 효과로 멀어질수록 서서히 사라지는 연출
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 폰(Pawn)의 실루엣을 그리기 위한 2D 포인트 배열
        const points = [];
        points.push(new THREE.Vector2(0, -3));
        points.push(new THREE.Vector2(2.5, -3)); // 밑받침
        points.push(new THREE.Vector2(2.2, -2.5));
        points.push(new THREE.Vector2(1.8, -2.0));
        points.push(new THREE.Vector2(1.0, -1.0));
        points.push(new THREE.Vector2(0.8, 1.0));  // 허리
        points.push(new THREE.Vector2(1.2, 1.2));  // 목 장식
        points.push(new THREE.Vector2(1.2, 1.5));
        points.push(new THREE.Vector2(0.6, 1.8));  // 목
        // 머리 (구형태 근사)
        for (let i = 0; i <= 10; i++) {
            const angle = (i / 10) * Math.PI;
            points.push(new THREE.Vector2(1.5 * Math.sin(angle), 1.8 + 1.5 * Math.cos(angle) + 1.5));
        }

        // 선반(Lathe) 기하학을 사용해 360도 회전시켜 3D 메쉬 생성
        const geometry = new THREE.LatheGeometry(points, 32);
        
        // 민트색 Wireframe(그리드) 재질 적용
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00FFAA, 
            wireframe: true,
            transparent: true,
            opacity: 0.3 // 너무 튀지 않게 은은하게
        });

        const pawn = new THREE.Mesh(geometry, material);
        
        // 요청하신 대로 '사선으로 기울어진 상태' 적용
        pawn.rotation.z = Math.PI / 4; 
        pawn.position.x = 3; // 약간 우측으로 배치
        scene.add(pawn);

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            // 사선 상태에서 x, y축으로 천천히 회전
            pawn.rotation.y += 0.005;
            pawn.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // 윈도우 리사이즈 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* ==========================================
           2. Chess.com API 데이터 패치 로직
        ========================================== */
        async function fetchGames() {
            const usernameInput = document.getElementById('username').value.trim();
            if (!usernameInput) return alert("Chess ID를 입력해주세요.");

            const btn = document.getElementById('fetch-btn');
            btn.disabled = true;
            btn.innerText = "불러오는 중...";

            // UI 전환
            document.getElementById('page1').classList.remove('active');
            const page2 = document.getElementById('page2');
            page2.classList.add('active-flex');
            document.getElementById('main-panel').classList.add('large');
            
            document.getElementById('display-user').innerText = usernameInput;
            const output = document.getElementById('pgn-output');
            const status = document.getElementById('result-status');
            
            output.innerText = "";
            status.innerText = "API 연결 중... (아카이브 조회)";

            const headers = {
                'User-Agent': 'CBTI_Prototype/1.0 (Contact: local_test)'
            };

            try {
                // 1. 아카이브 목록 가져오기
                const archiveRes = await fetch(`https://api.chess.com/pub/player/${usernameInput}/games/archives`, { headers });
                if (!archiveRes.ok) throw new Error("유저를 찾을 수 없거나 데이터를 가져올 수 없습니다.");
                
                const archiveData = await archiveRes.json();
                const archives = archiveData.archives || [];
                
                if (archives.length === 0) {
                    status.innerText = "최근 플레이한 게임 기록이 없습니다.";
                    btn.disabled = false;
                    btn.innerText = "기보 가져오기";
                    return;
                }

                let allGames = [];
                status.innerText = "최근 기보를 수집하고 있습니다...";

                // 2. 가장 최신 달(배열의 끝)부터 역순으로 검색하여 최대 100경기 수집
                for (let i = archives.length - 1; i >= 0; i--) {
                    const monthRes = await fetch(archives[i], { headers });
                    if (monthRes.ok) {
                        const monthData = await monthRes.json();
                        let games = monthData.games || [];
                        
                        // 해당 월의 게임은 오래된 순이므로, 최신순으로 뒤집기
                        games.reverse();
                        allGames = allGames.concat(games);
                        
                        if (allGames.length >= 100) break;
                    }
                }

                // 정확히 100개까지만 슬라이싱 (혹은 있는 만큼)
                const recentGames = allGames.slice(0, 100);
                
                status.innerText = `성공! 총 ${recentGames.length}개의 기보를 가져왔습니다.`;
                
                // 3. PGN 데이터 텍스트로 변환하여 화면에 출력
                let resultText = "";
                recentGames.forEach((game, index) => {
                    resultText += `[Game ${index + 1}] FIDE: ${game.rules} | TimeControl: ${game.time_class}\n`;
                    resultText += `${game.pgn}\n\n`;
                    resultText += `---------------------------------------------------\n\n`;
                });

                output.innerText = resultText;

            } catch (error) {
                status.innerText = `오류 발생: ${error.message}`;
                output.innerText = "오류로 인해 데이터를 표시할 수 없습니다.";
            } finally {
                btn.disabled = false;
                btn.innerText = "기보 가져오기";
            }
        }

        // 초기 화면으로 돌아가기
        function goBack() {
            document.getElementById('page2').classList.remove('active-flex');
            document.getElementById('main-panel').classList.remove('large');
            document.getElementById('page1').classList.add('active');
            document.getElementById('username').value = '';
        }

        // 엔터키 입력 지원
        document.getElementById('username').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchGames();
            }
        });
    </script>
</body>
</html>
